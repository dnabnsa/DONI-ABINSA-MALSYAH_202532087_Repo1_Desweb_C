<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Pendaki - Gunung Luhur via Sukamakmur</title>
</head>
<body>

  <header>
    <h1>Registrasi Pendaki</h1>
    <nav>
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="jalur.html">Jalur Pendakian</a></li>
        <li><a href="persiapan.html">Persiapan</a></li>
        <li><a href="registrasi.html">Registrasi</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section>
      <h2>Formulir Registrasi</h2>
      <p>Semua kolom wajib diisi sebelum formulir dapat dikirim.</p>

      <form action="registrasi.html" method="get">

        <fieldset>
          <legend>Data Pendaki</legend>

          <p>
            <label for="nama">Nama lengkap</label><br>
            <input type="text" id="nama" name="nama" required>
          </p>

          <p>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="tanggal">Tanggal pendakian</label><br>
            <input type="date" id="tanggal" name="tanggal" required>
          </p>
        </fieldset>

        <fieldset>
          <legend>Pengalaman Mendaki</legend>

          <p>
            <input type="radio" id="pemula" name="pengalaman" value="pemula" required>
            <label for="pemula">Pemula</label>
          </p>
          <p>
            <input type="radio" id="berpengalaman" name="pengalaman" value="berpengalaman">
            <label for="berpengalaman">Berpengalaman</label>
          </p>
        </fieldset>

        <p>
          <input type="checkbox" id="setuju" name="setuju" value="ya" required>
          <label for="setuju">Saya menyetujui aturan pendakian</label>
        </p>

        <p>
          <button type="submit">Kirim Registrasi</button>
        </p>

      </form>
    </section>

  </main>

  <footer>
    <p>&copy; Doni Abinsa Malsyah_NIM 202532087_Kelas C</p>
  </footer>

</body>
</html>
